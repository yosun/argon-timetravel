<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" width="760" height="680" style="background:#070b14;font-family:monospace;">
  <defs>
    <pattern id="grid1m" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="680" fill="url(#grid1m)"/>

  <!-- Title & Legend -->
  <rect x="16" y="14" width="728" height="58" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="28" y="36" fill="#f8fafc" font-size="14" font-weight="bold">WORKFLOW #6: TOP-DOWN 2D METRIC FLOORPLAN (Saint-Guilhem Romanesque Cloister)</text>
  <circle cx="34" cy="54" r="5" fill="#38bdf8"/>
  <text x="46" y="58" fill="#94a3b8" font-size="11">Observed MoGe-2 Metric Point Cloud (Z = -1.44m to -15.97m, FOV = 98.8°)</text>
  <rect x="445" y="48" width="12" height="10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="464" y="58" fill="#fde68a" font-size="11">Inferred 3D Volumetric Extrusions (Blender bpy)</text>

  <!-- Coordinate System Note: Center X=380 is X=0.0m; Bottom Y=610 is Camera [0,0,0]; Scale: 45px = 1.0 meter -->
  <!-- Inferred Outer Ambulatory Cloister Walls (X = -5.8m to +5.8m, Z = -1.0m to -14.2m) -->
  <rect x="119" y="85" width="522" height="480" fill="#1e293b" fill-opacity="0.35" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="130" y="104" fill="#94a3b8" font-size="10">INFERRED REAR AMBULATORY WALLS (X = ±5.80m, Z = -13.80m)</text>

  <!-- Observed Inner Courtyard Pebble Floor (X = -4.3m to +4.4m, Z = -1.5m to -11.85m, Y = -1.72m) -->
  <rect x="186" y="140" width="388" height="405" fill="#334155" fill-opacity="0.45" stroke="#38bdf8" stroke-width="2"/>
  <text x="270" y="528" fill="#7dd3fc" font-size="11">OBSERVED PEBBLE COURTYARD FLOOR (8.70m × 10.35m | Y = -1.72m)</text>

  <!-- Camera Frustum Rays from [0,0,0] at (380, 610) -->
  <path d="M 380 610 L 140 120 L 620 120 Z" fill="#38bdf8" fill-opacity="0.06" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="380" cy="610" r="7" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
  <text x="295" y="634" fill="#38bdf8" font-size="12" font-weight="bold">CAMERA [0, 0, 0] (FOV 98.8°)</text>

  <!-- North 5-Bay Romanesque Arcade at Z = -11.85m (Y_svg = 140) -->
  <rect x="186" y="132" width="388" height="16" fill="#78350f" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="235" y="125" fill="#fde68a" font-size="11" font-weight="bold">NORTH 5-BAY ROMANESQUE ARCADE (Z = -11.85m, H = 4.50m)</text>
  <!-- 6 North Arcade Columns -->
  <circle cx="206" cy="140" r="6" fill="#fbbf24"/><circle cx="275" cy="140" r="6" fill="#fbbf24"/>
  <circle cx="345" cy="140" r="6" fill="#fbbf24"/><circle cx="415" cy="140" r="6" fill="#fbbf24"/>
  <circle cx="485" cy="140" r="6" fill="#fbbf24"/><circle cx="554" cy="140" r="6" fill="#fbbf24"/>

  <!-- West 3-Bay Colonnade at X = -4.25m (X_svg = 186) -->
  <rect x="178" y="148" width="16" height="310" fill="#065f46" fill-opacity="0.7" stroke="#34d399" stroke-width="2"/>
  <text x="125" y="310" fill="#6ee7b7" font-size="10" transform="rotate(-90 125 310)">WEST COLONNADE (X = -4.25m)</text>
  <circle cx="186" cy="195" r="5" fill="#34d399"/><circle cx="186" cy="265" r="5" fill="#34d399"/>
  <circle cx="186" cy="335" r="5" fill="#34d399"/><circle cx="186" cy="405" r="5" fill="#34d399"/>

  <!-- East 3-Bay Colonnade at X = +4.40m (X_svg = 574) -->
  <rect x="566" y="148" width="16" height="310" fill="#4c1d95" fill-opacity="0.7" stroke="#a78bfa" stroke-width="2"/>
  <text x="615" y="310" fill="#c4b5fd" font-size="10" transform="rotate(90 615 310)">EAST COLONNADE (X = +4.40m)</text>
  <circle cx="574" cy="195" r="5" fill="#a78bfa"/><circle cx="574" cy="265" r="5" fill="#a78bfa"/>
  <circle cx="574" cy="335" r="5" fill="#a78bfa"/><circle cx="574" cy="405" r="5" fill="#a78bfa"/>

  <!-- Overhead 3x3 Coffered Skylight Grid Projection (Y = +7.50m) -->
  <rect x="215" y="175" width="330" height="260" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="325" y1="175" x2="325" y2="435" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="435" y1="175" x2="435" y2="435" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="215" y1="262" x2="545" y2="262" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="215" y1="348" x2="545" y2="348" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="275" y="192" fill="#38bdf8" font-size="10">3×3 COFFERED SKYLIGHT ROOF (Y = +7.50m)</text>

  <!-- Central Carved Stone Wellhead & Potted Fern Cluster at (X = 0.0m, Z = -4.45m -> Y_svg = 410) -->
  <circle cx="380" cy="410" r="52" fill="#14532d" fill-opacity="0.55" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="380" cy="410" r="20" fill="#be185d" fill-opacity="0.85" stroke="#f472b6" stroke-width="2"/>
  <text x="295" y="478" fill="#f472b6" font-size="11" font-weight="bold">WELLHEAD &amp; FERN RING (X=0.0m, Z=-4.45m)</text>
</svg>